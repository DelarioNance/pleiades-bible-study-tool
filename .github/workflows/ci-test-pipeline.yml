# """
# Python Test Runner with Postgres Service
#
# This pipeline validates all pull requests targeting the `main` branch by:
#  1. Creating a GitHub runner (a virtual Linux machine) 
#  2. Installing Python on the virtual Linux machine
#  3. Running a sequence of terminal commands
# Links:
# - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onevent_nametypes
# - https://coderivers.org/blog/github-actions-python/
# """


# name for workflow (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#name)
name: Run Unit Test via Pytest

# name for generated workflow run (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#run-name
run-name: ${{ github.actor }} is validating PR against test suite  

# trigger event
on: pull_request

jobs:
  # name of job
  tests:
    # specifies the type of virtual machine to use (e.g., latest Ubuntu version)
    runs-on: ubuntu-latest
    # steps of job
    steps:
      # lets the runner access the repository code (https://github.com/actions/checkout)
      - uses: actions/checkout@v4  
      # Installs Python on the runner (https://github.com/actions/setup-python)
      - uses: actions/setup-python@v5 
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest
