# """
# Python Test Runner with Postgres Service
#
# This workflow runs the project's Python test suite inside GitHub Actions.
# GitHub Actions provides a fresh Ubuntu runner (virtual machine) 
# for each job, and service containers allow additional processes—such as 
# a Postgres database—to run alongside the runner in isolated Docker containers.
#
# In this workflow:
#   - A Postgres 16 service container is started and made reachable at the
#     hostname `postgres`.
#   - The runner installs Python, project dependencies, and executes pytest.
#
# This setup ensures tests run against a real Postgres instance in a clean,
# reproducible environment for every pull request.
# """


# Name of this GitHub Actions workflow (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#name)
name: Run Continuous Integration (CI)

# Name shown in the GitHub Actions UI for each workflow run (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#run-name
run-name: ${{ github.actor }} is running CI 

# Trigger this workflow on PRs (not sure if it's specific to PRs targeting main)
on: pull_request

jobs:
  tests: # Job definition
    runs-on: ubuntu-latest # Use the latest Ubuntu runner as the execution environment
    env:
      PLEIADES_ENV: test # Set the environment variable PLEIADES_ENV to "test" for the test suite (the code uses this to determine which database credentials to use)
      DB_HOST_ADMIN: localhost # The Postgres service container is reachable at host "postgres"
      DB_USER_ADMIN: ${{ secrets.CI_DB_USER }} # this and the two below must match credential chosen when creating Postgres service container (needed for src code to connect to the create DB via its credentials)
      DB_PASSWORD_ADMIN: ${{ secrets.CI_DB_PASSWORD }}
      DB_NAME_ADMIN: ${{ secrets.CI_DB_NAME }}
      DB_HOST_TEST: localhost # The Postgres service container is reachable at host "postgres"
      DB_USER_TEST: ${{ secrets.CI_DB_USER }} # this and the two below must match credential chosen when creating Postgres service container (needed for src code to connect to the create DB via its credentials)
      DB_PASSWORD_TEST: ${{ secrets.CI_DB_PASSWORD }}
      DB_NAME_TEST: ${{ secrets.CI_DB_NAME }}
    services:
      postgres: # Start a Postgres 16 service container for the test suite (https://docs.github.com/en/actions/tutorials/use-containerized-services/create-postgresql-service-containers)
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_DB_USER }} # Credentials used to initialize the Postgres service (the key names are arbitrary)
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_DB_NAME }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432 # Map the runner's port 5432 to the container's port 5432 so the runner can connect to Postgres at "postgres:5432" (for some reason, the src or code tries to use port 5432, so the left port must be 5432; the right port must also be 5432 because that's the default Postgres port and the container expects it to be 5432)
    steps: # Steps executed on the runner
      - uses: actions/checkout@v4 # Access (checkout) the repository code (https://github.com/actions/checkout)
      - uses: actions/setup-python@v5 # Install Python 3.12 on the runner (https://github.com/actions/setup-python) 
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements.txt
      - name: Run ETL Tests
        run: pytest tests/backend/etl
      - name: Run API Tests
        run: pytest tests/backend/api