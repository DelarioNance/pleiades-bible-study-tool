# ---------------------------------------------------------------------------
# Staging Tests
#
# Purpose:
#   Runs the Pleiades UI test suite against the deployed staging environment
#   after a successful staging deployment.
#
# Triggers:
#   - Completion of the "Continuous Deployment (CD)" workflow, but only when
#     that run succeeded. The workflow name in the trigger must match the
#     name in the CD workflow exactly.
#
# Required secrets:
#   - URL_STAGING: base URL of the staging app that the UI tests run against.
#
# Notes:
#   - Only the UI tests run here. They hit the live staging site, so the app
#     does not need to be started on the runner and no database service is
#     created.
#   - The citations at the bottom of the screen are not covered by automated
#     tests and should still be checked manually in staging.
# ---------------------------------------------------------------------------

# Name of this GitHub Actions workflow (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#name)
name: Run Staging Tests

# Name shown in the GitHub Actions UI for each workflow run (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#run-name
run-name: ${{ github.actor }} is running staging tests

# Trigger this workflow on PRs (not sure if it's specific to PRs targeting main)
on:
  workflow_run:
    workflows: [Continuous Deployment (CD)] # must match the name in the CD pipeline
    types: [completed]
  workflow_call: # allows this workflow to be called by another workflow

jobs:
  tests: # Job definition
    runs-on: ubuntu-24.04 # Explictly use an Ubuntu runner that Playwright supports to avoid using a newer Ubuntu runner that Playwright does not support
    
    # Run after a successful CD run (workflow_run), or when a caller workflow is
    # started manually (workflow_dispatch). A called workflow inherits the caller's
    # event, so this is what lets the UI test flakiness experiment run these tests.
    # Note: the behavior for failed CD runs started via workflow_dispatch has not
    # been verified. Running tests after a failed deployment is undesirable, but
    # the impact is low enough that preventing it is not a priority.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    env:
      PLEIADES_ENV: staging
      URL_STAGING: ${{ secrets.URL_STAGING }}
    steps: # Steps executed on the runner
      - uses: actions/checkout@v4 # Access (checkout) the repository code (https://github.com/actions/checkout)
      - name: Install UI test dependencies
        run: |
          sudo apt update
          sudo apt install openjdk-17-jdk # install Java 17
        working-directory: tests/ui
      - name: Run UI Tests
        run: mvn clean package
        working-directory: tests/ui