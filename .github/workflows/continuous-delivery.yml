# ---------------------------------------------------------------------------
# Continuous Deployment (CD): Staging
#
# Purpose:
#   Rebuilds the staging database and deploys the Pleiades app to the staging
#   environment on FastAPI Cloud.
#
# Triggers:
#   - A pull request into main is closed.
#   - Manual run from the Actions tab (workflow_dispatch).
#
# Required secrets:
#   - DB_HOST_STAGING, DB_USER_STAGING, DB_PASSWORD_STAGING, DB_NAME_STAGING:
#     staging database connection details used by the ETL.
#   - FASTAPI_CLOUD_STAGING_DEPLOY_TOKEN: authentication token for deployment.
#   - FASTAPI_CLOUD_STAGING_APP_ID: ID of the staging app on FastAPI Cloud.
#
# Notes:
#   - The staging database variables are also configured in FastAPI Cloud, so
#     they currently live in two places: GitHub Actions and FastAPI Cloud.
#   - The ETL rebuilds the staging tables on every run. Since the ETL is
#     transactional, staging may be blocked while the transaction is running.
# ---------------------------------------------------------------------------
  
# Name of this GitHub Actions workflow (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#name)
name: Continuous Deployment (CD)

# Name shown in the GitHub Actions UI for each workflow run (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#run-name
run-name: ${{ github.actor }} is running CD

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  deployment: # Job definition
    runs-on: ubuntu-24.04 # Explictly use an Ubuntu runner that Python supports to avoid using a newer Ubuntu runner that Python does not support
    env: # not ideal to have staging variables in github actions and fastapi cloud
      PLEIADES_ENV: staging
      DB_HOST_STAGING: ${{ secrets.DB_HOST_STAGING }}
      DB_USER_STAGING: ${{ secrets.DB_USER_STAGING }}
      DB_PASSWORD_STAGING: ${{ secrets.DB_PASSWORD_STAGING }}
      DB_NAME_STAGING: ${{ secrets.DB_NAME_STAGING }}
    steps: # Steps executed on the runner
      - uses: actions/checkout@v4 # Access (checkout) the repository code (https://github.com/actions/checkout)
      - name: Install FastAPI
        run: pip install fastapi[standard]
      - name: Install ETL and API dependencies (only ETL is needed here)
        run: pip install -r requirements.txt
      - name: Run ETL
        run: python -m src.etl.run_etl staging
      - name: Deploy to Staging Environment
        run: fastapi deploy
        env: # The FASTAPI_CLOUD_TOKEN and FASTAPI_CLOUD_APP_ID environment variables are required for deployment to FastAPI Cloud. They are stored as GitHub secrets for security.
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_STAGING_DEPLOY_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_STAGING_APP_ID }}
