name: UI Test Flakiness Experiment

run-name: ${{ github.actor }} is measuring UI test flakiness

on:
  workflow_dispatch:
  push:
    branches: [ui-test-flakiness-experiment]

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      PLEIADES_ENV: staging
      URL_STAGING: ${{ secrets.URL_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - name: Install UI test dependencies
        run: |
            sudo apt update
            sudo apt install openjdk-17-jdk # install Java 17
        working-directory: tests/ui
      - name: Run UI Tests 50 Times
        run: |
            num_iterations = 50
            for (( i=0; i < num_iterations; i++ ))
            do
                echo "========== Iteration $i =========="
                mvn clean package || exit 1
            done
        working-directory: tests/ui