name: UI Test Flakiness Experiment

run-name: ${{ github.actor }} is measuring UI test flakiness

on:
  workflow_dispatch:
  push:
    branches: [ui-test-flakiness-experiment] # temporarily using so I can test the workflow in the feature branch without needing to first merge PR to main

jobs:
    LoopMatrix:
        strategy:
            max-parallel: 1 # using sequential runs to prevent the possibility of concurrent race conditions between UI tests
            matrix:
                iteration: [1, 2, 3]
        uses: ./.github/workflows/staging-tests.yml
        secrets:
            URL_STAGING: ${{ secrets.URL_STAGING }}
