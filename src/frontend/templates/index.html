<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pleaides Bible Study Tool</title>
    <link rel="stylesheet" href="src/frontend/static/css/styles.css">
</head>
<body>
    <h1>Pleiades Bible Study Tool</h1>

    <div id="app">
        <!-- Dynamic content will be put here-->
    </div>

    <script>
        window.defaultSelections = Object.freeze({
            bookID: "{{ defaultBookID }}",
            chapterID: "{{ defaultChapterID }}",
            verseID: "{{ defaultVerseID }}",
            depth: "{{ defaultDepth }}"
        }) // freeze is used to make the object contents immutable instead of just the object reference
        
    </script>

    <script type="module" src="src/frontend/static/js/app.js"></script>
</body>
</html>
